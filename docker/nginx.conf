server {
    # Порт 3000 сохранён для совместимости с compose-файлами (dev и prod публикуют :3000).
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Хешированные бандлы CRA можно кешировать надолго.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Runtime-конфиг и index.html не кешируем — иначе после смены адреса API/релиза браузер возьмёт старые.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: все неизвестные пути отдаём index.html (маршруты react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
