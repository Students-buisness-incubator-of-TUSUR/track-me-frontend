name: Build and Push Docker Image

# Сборка и публикация образа в GHCR на каждый push в develop/main и релизный тег — независимо от CI
# (тестов/Sonar), как build-artifacts.yml в монорепо track-me. deploy-dev стартует по его завершении.

permissions:
  contents: read
  packages: write

on:
  push:
    # develop → dev-линия образов; main и теги v*.*.* → prod-линия (см. deploy-dev / deploy-prod)
    branches: [ develop, main ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'

jobs:
  build-push:
    # Тег ${{ github.sha }} нужен deploy-dev (разворачивает образ ровно того коммита, что собран).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image repository name
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Compute image tags
        id: tags
        run: |
          IMG="ghcr.io/${IMAGE_REPO}"
          {
            echo "list<<EOF"
            # Всегда: неизменяемый тег по коммиту + тег по ref (develop / main / vX.Y.Z)
            echo "${IMG}:${GITHUB_SHA}"
            echo "${IMG}:${GITHUB_REF_NAME}"
            # :latest двигаем только с develop, чтобы релизный тег/main не затирали dev-линию
            if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "develop" ]]; then
              echo "${IMG}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
